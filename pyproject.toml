[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-telegram-dashboard"
version = "0.5.0"
description = "Chat-native read-only Telegram status dashboard for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ilya Balobanov"}]
keywords = ["hermes-agent", "telegram", "dashboard", "monitoring", "observability"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2",
  "twine>=5,<7",
]

# The package lives inside the plugin folder, the shape the gateway loads: a plugin installed
# from the Hermes catalog gets that folder and nothing else.
[tool.hatch.build.targets.wheel]
packages = ["plugin/telegram_dashboard_probe/telegram_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin/telegram_dashboard_probe"]

[tool.ruff]
target-version = "py311"
line-length = 100
# First-party detection for import sorting: the package lives inside the plugin folder.
src = [".", "plugin/telegram_dashboard_probe"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The output of check_drift.py, a Russian-language script on the installation, as test input.
"tests/test_collect*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "plugin/telegram_dashboard_probe"
