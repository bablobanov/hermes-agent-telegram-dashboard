name: telegram_dashboard_probe
version: 1.2.0-beta.1
requires_hermes: ">=0.22.2"
description: >-
  Read-only Hermes dashboard as one pinned Telegram message edited in place on every tick by a
  task inside the gateway: status, freshness, coverage, last backup, account limits, config
  drift, the cron ticker and its jobs (failed runs, undelivered results, a dead ticker),
  whether the connected Telegram channel is deaf, whether the agent sees its rules (the
  context files in the saved system prompt of each platform, read-only from state.db),
  whether its memory works (the notebooks against their limits, the writes waiting for
  approval, a configured provider's errors; numbers only), the free space of the disk the
  profile lies on, the Hermes version against the latest upstream release with a new release
  marked for a day, up to five events on one phone screen, the reasons and stamps in a
  collapsed details block. HTML when the adapter takes it, else plain text; a tick that cannot
  build the screen still edits the message. Preview (1.2.0-beta.1, outside the catalog): with
  the setting widget on, the same screen also as one pinned Telegram HTML widget (Bot API 10.4)
  in the owner's private chat with the bot, tabs Status, Cron and Details drawn by the client,
  only its data rewritten on a tick; through the engine's widget verbs where it has them, else
  through the gateway's own Telegram client.
author: Ilya Balobanov
