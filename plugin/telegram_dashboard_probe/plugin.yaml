name: telegram_dashboard_probe
version: 0.11.0
description: >-
  Read-only Hermes dashboard as one pinned Telegram message edited in place on every tick by a
  task inside the gateway: status, freshness, coverage, last backup, account limits, config
  drift, the cron ticker and its jobs (failed runs, undelivered results, a dead ticker),
  whether the connected Telegram channel is deaf, whether the agent sees its rules (the
  context files in the saved system prompt of each platform, read-only from state.db),
  whether its memory works (the notebooks against their limits, the writes waiting for
  approval, a configured provider's errors; numbers only), the Hermes version against the
  latest upstream release with a new release marked for a day, up to five events on one phone
  screen, the reasons and stamps in a collapsed details block. HTML when the adapter takes it,
  plain text otherwise; a tick that cannot build the screen still edits the message.
author: Ilya Balobanov
